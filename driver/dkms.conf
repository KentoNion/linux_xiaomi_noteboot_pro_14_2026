# DKMS-описание для патченного bitland-mifs-wmi (TM2424 thin-ultrabook
# perf-mode fix). Устанавливается в /lib/modules/<kernel>/updates/dkms/,
# которому depmod отдаёт приоритет перед in-tree
# /lib/modules/<kernel>/kernel/drivers/platform/x86/ - поэтому патченный
# модуль подхватывается автоматически без ручного blacklist оригинала,
# и переживает обновления ядра (DKMS пересобирает сам через pacman-хук).

PACKAGE_NAME="bitland-mifs-wmi-tm2424"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="bitland-mifs-wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
